# SignBridge AI: Comprehensive Algorithms & Implementation Specification

---

## 3. Algorithm Deep Dives & Implementation Details

### Algorithm 1: Holistic Landmark Pruning (543 $\to$ 107 Points)

#### Purpose & Motivation
Raw MediaPipe Holistic generates **543 3D coordinates** per frame (33 pose, 21 left hand, 21 right hand, 468 face mesh). Processing all 543 points at 30 FPS introduces excessive memory bandwidth overhead and redundant facial vertices that do not contribute to sign semantics.

#### Mathematical Subsetting
The raw set $P_{\text{raw}} \in \mathbb{R}^{543 \times 3}$ is projected into a compact canonical vector $P_{\text{pruned}} \in \mathbb{R}^{107 \times 3}$:

$$\mathcal{S}_{\text{canonical}} = \mathcal{S}_{\text{pose}} \cup \mathcal{S}_{\text{lh}} \cup \mathcal{S}_{\text{rh}} \cup \mathcal{S}_{\text{face}}$$

* **Upper-Body Pose ($\mathcal{S}_{\text{pose}}$, 25 joints):** Indices $[0 \dots 24]$ capturing the head, clavicle, shoulders, elbows, wrists, and hips. Lower extremities are discarded as ISL signing occurs above the waist.
* **Left Hand ($\mathcal{S}_{\text{lh}}$, 21 joints):** Complete kinematic skeleton: wrist, CMC, MCP, PIP, DIP, and fingertips across 5 digits.
* **Right Hand ($\mathcal{S}_{\text{rh}}$, 21 joints):** Complete kinematic skeleton of the dominant/auxiliary hand.
* **Non-Manual Markers Facial Contours ($\mathcal{S}_{\text{face}}$, 40 joints):** Targeted extraction of eyebrow arches (furrowing for Wh-questions), upper/lower lip vermilion borders (mouthing markers), and eye contours.

```
Total dimensionality: 107 vertices × 3 coordinates (X, Y, Z) = 321 float32 values / frame
```

---

### Algorithm 2: Euclidean Centroid & Affine Normalization Engine

#### Problem Formulation
Signers sit or stand at varying distances from webcams, shift horizontally in the frame, or possess different body proportions. Recognition must be invariant to:
1. 3D Camera Translation ($T_x, T_y, T_z$).
2. Subject-to-Camera Distance (Scale $S$).
3. Left-Right Camera Mirroring (Selfie View vs. True Spatial View).

#### Mathematical Formulation
Implemented in [`backend/normalization.py`](file:///c:/Users/srish/.gemini/antigravity/scratch/signbridge/backend/normalization.py):

```python
# 1. Torso Centroid Calculation
left_shoulder = landmarks[11]   # Index 11
right_shoulder = landmarks[12]  # Index 12
P_center = (left_shoulder + right_shoulder) / 2.0

# 2. Euclidean Bi-Acromial Scale Metric
d_scale = np.linalg.norm(left_shoulder - right_shoulder)
if d_scale < 1e-6:
    d_scale = 0.40  # Fallback epsilon to prevent division-by-zero

# 3. Affine Invariant Normalization
P_normalized = (landmarks - P_center) / d_scale

# 4. Standardized Lateral Coordinate Orientation (Right = +X, Left = -X)
if P_normalized[11, 0] > P_normalized[12, 0]:
    P_normalized[:, 0] = -P_normalized[:, 0]
```

$$\hat{P}_i(t) = \frac{P_i(t) - P_{\text{center}}(t)}{\|P_{\text{left\_shoulder}}(t) - P_{\text{right\_shoulder}}(t)\|_2}$$

This transformation pins the center of the chest to $(0, 0, 0)$ and standardizes shoulder width to exactly $1.0$ unit, ensuring uniform feature representations across children, adults, and differing camera angles.

### Algorithm 3: Uniform Temporal Spline Resampling ($K \to T=30$)

#### Problem Formulation
Natural signing rates vary: a fast signer might execute `HELP` in 18 frames (0.6s), while a deliberate signer takes 45 frames (1.5s). Deep Graph Convolutional layers require a fixed-length tensor input $T = 30$ frames (1.0 second canonical window).

#### Resampling Formula
Given an arbitrary sequence $S = [f_0, f_1, \dots, f_{K-1}]$ of length $K$, the resampled sequence $S^* = [f^*_0, \dots, f^*_{29}]$ is generated using barycentric linear interpolation:

$$\tau(i) = i \cdot \frac{K - 1}{T - 1}, \quad \text{for } i \in \{0, 1, \dots, 29\}$$

$$\text{low} = \lfloor \tau(i) \rfloor, \quad \text{high} = \lceil \tau(i) \rceil, \quad \alpha = \tau(i) - \text{low}$$

$$f^*_i = (1 - \alpha) \cdot f_{\text{low}} + \alpha \cdot f_{\text{high}}$$

This preserves acceleration and deceleration inflection points while standardizing tensor shapes to $(B, C=3, T=30, V=107)$.

### Algorithm 4: Spatial-Temporal Graph Convolutional Network (ST-GCN) & Bi-LSTM

#### Spatio-Temporal Graph Construction
The human skeleton is modeled as a non-Euclidean spatio-temporal graph $G = (V, E)$:
* **Node Set $V$:** 107 joints across 30 time steps ($3,210$ total spatio-temporal nodes).
* **Spatial Edges $E_S$:** $118$ natural anatomical bone connections (inter-finger joints, wrist-to-elbow, shoulder-to-neck).
* **Temporal Edges $E_T$:** Directed trajectories connecting joint $v_i(t) \to v_i(t+1)$.

#### Graph Convolution Formulation
Implemented in [`backend/stgcn_pytorch.py`](file:///c:/Users/srish/.gemini/antigravity/scratch/signbridge/backend/stgcn_pytorch.py):

```python
class SpatialGraphConv(nn.Module):
    def __init__(self, in_channels, out_channels, A_norm):
        super().__init__()
        self.register_buffer("A", A_norm)  # (V, V) normalized Laplacian
        self.conv = nn.Conv2d(in_channels, out_channels, kernel_size=1)
        self.bn = nn.BatchNorm2d(out_channels)
        self.relu = nn.ReLU(inplace=True)
        self.res = nn.Conv2d(in_channels, out_channels, kernel_size=1)

    def forward(self, x):
        # x: (Batch, Channels, Time, Vertices)
        res = self.res(x)
        out_graph = torch.matmul(x, self.A)  # Propagate features along skeletal bones
        return self.relu(self.bn(self.conv(out_graph)) + res)
```

Mathematically, the spatial graph convolution is defined as:

$$X^{(l+1)} = \sigma \left( \sum_{k=1}^{K_v} W_k \left( X^{(l)} \cdot \tilde{A}_k \odot M_k \right) \right) + W_{\text{res}} X^{(l)}$$

Where:
* $\tilde{A}_k = D_k^{-\frac{1}{2}} (A_k + I) D_k^{-\frac{1}{2}}$ is the symmetrically normalized adjacency matrix.
* $M_k \in \mathbb{R}^{V \times V}$ is a **learnable spatial edge attention mask**, allowing the model to dynamically increase attention on fingertip contact points.
* $W_k$ represents trainable $1 \times 1$ convolutional kernels.

#### Temporal 1D Convolutions & Bi-LSTM Head
Following spatial convolution, a 1D temporal convolution with kernel size $K_t = 5$ processes the time axis:

$$\text{Out}_{\text{temporal}}(t) = \text{Dropout} \left( \text{ReLU} \left( \text{BatchNorm} \left( \text{Conv1D}_{5 \times 1}(X) \right) \right) \right) + X$$

To capture long-range linguistic context and co-articulation, the spatial features are globally pooled across joints and fed into a **Bidirectional LSTM (Bi-LSTM)**:

$$h_t = \left[ \overrightarrow{\text{LSTM}}(x_t); \overleftarrow{\text{LSTM}}(x_t) \right]$$

### Algorithm 5: Connectionist Temporal Classification (CTC) Sequence Decoder

#### Objective & Formulation
Continuous signing does not have explicit segment pauses between gestures. SignBridge trains against the **CTC Loss** objective ([`backend/ctc_decoder.py`](file:///c:/Users/srish/.gemini/antigravity/scratch/signbridge/backend/ctc_decoder.py)):

$$\mathcal{L}_{\text{CTC}} = -\ln \sum_{\pi \in \mathcal{B}^{-1}(Y)} \prod_{t=1}^T P(\pi_t \mid X_t)$$

Where $\pi$ represents a valid frame-level alignment containing signs and `<BLANK>` tokens.

#### Greedy Collapse Algorithm
```python
def decode_greedy(probabilities, blank_idx=0, min_persistence=2):
    # 1. Best class per frame
    best_indices = np.argmax(probabilities, axis=-1)
    
    # 2. Extract contiguous segments of identical tokens
    segments = []
    current_idx, start_t = best_indices[0], 0
    for t in range(1, len(best_indices)):
        if best_indices[t] != current_idx:
            segments.append((current_idx, start_t, t - 1))
            current_idx, start_t = best_indices[t], t
    segments.append((current_idx, start_t, len(best_indices) - 1))
    
    # 3. Filter blanks and apply persistence threshold
    results = []
    for idx, s_start, s_end in segments:
        duration = s_end - s_start + 1
        if idx != blank_idx and duration >= min_persistence:
            confidence = float(np.mean(probabilities[s_start:s_end+1, idx]))
            results.append({"gloss": VOCAB[idx], "confidence": confidence, "duration": duration})
    return results
```

This collapses redundant multi-frame predictions (e.g. `[BLANK, DOCTOR, DOCTOR, DOCTOR, BLANK, CHEST, CHEST]`) into clean, discrete linguistic tokens (`['DOCTOR', 'CHEST']`).

### Algorithm 6: Biomechanical Kinematic Trajectory & Handshape Classifier

#### Purpose
Deep neural networks can occasionally produce false positives on stationary hands or background noise. SignBridge implements a parallel deterministic physics engine ([`backend/stgcn_model.py`](file:///c:/Users/srish/.gemini/antigravity/scratch/signbridge/backend/stgcn_model.py)) as an affirmative validation gate.

#### Kinematic Equations
1. **Instantaneous Velocity & Gating:**
   $$\vec{v}_{\text{wrist}}(t) = \frac{P_{\text{wrist}}(t) - P_{\text{wrist}}(t-1)}{\Delta t}$$
   $$\text{Speed}_{\text{peak}} = \max_{t} \|\vec{v}_{\text{wrist}}(t)\|_2$$
   *If $\text{Speed}_{\text{peak}} < 0.04$, the window is rejected as stationary resting posture (`IDLE / <BLANK>`).*

2. **Oscillatory Inflection Counting (Second-Order Finite Differences):**
   $$\Delta y_1 = y(t-1) - y(t-2), \quad \Delta y_2 = y(t) - y(t-1)$$
   $$\text{Condition: } (\Delta y_1 \cdot \Delta y_2 < -0.0004) \land (|\Delta y_1| > 0.005)$$
   *Detects vertical nods (`YES`) vs. lateral head/finger shakes (`NO`).*

3. **Radial Finger Extension Ratio:**
   $$R_{\text{finger}} = \frac{\|P_{\text{tip}} - P_{\text{wrist}}\|_2}{\|P_{\text{MCP}} - P_{\text{wrist}}\|_2}$$
   * $R > 1.40 \implies$ Extended digit.
   * $R < 1.05 \implies$ Curled fist.
   * Classifies distinct handshapes: Open Palm (`HELLO`, `PLEASE`), Thumbs-up (`HELP`), Index-pointing (`WHERE`), and W-Handshape (`WATER`).

---

### Algorithm 7: 3D Procedural Synthetic Augmentation Engine

#### Purpose
Sign language datasets suffer from signer scarcity and body size imbalance. The engine ([`backend/dataset_augmentation.py`](file:///c:/Users/srish/.gemini/antigravity/scratch/signbridge/backend/dataset_augmentation.py)) generates infinite physically plausible training variants without capturing unconsented personal video.

#### Mathematical Transformations
1. **3D Rodrigues Euler Rotation:**
   Rotates the entire 107-point skeleton around the torso center:
   $$R(\theta_x, \theta_y, \theta_z) = R_z(\theta_z) \cdot R_y(\theta_y) \cdot R_x(\theta_x), \quad \theta \sim \mathcal{U}(-12^\circ, +12^\circ)$$
   $$P_{\text{aug}} = R \cdot (P - P_{\text{center}}) + P_{\text{center}}$$

2. **Anthropometric Limb Scaling:**
   Independent perturbation of arm-span vs. torso height:
   $$S_{\text{arm}} \sim \mathcal{U}(0.90, 1.10), \quad S_{\text{torso}} \sim \mathcal{U}(0.92, 1.08)$$

3. **Gaussian Sensor Jitter:**
   $$\hat{P} = P + \mathcal{N}(0, \sigma^2), \quad \sigma = 0.004$$

4. **Temporal Time-Warping Splines:**
   Non-linear monotonic warping function $w(t) = t + \beta \sin(\pi t / T)$ simulating acceleration and hesitation.

### Algorithm 8: Natural Language Grammar Translation Engine (Topic-Comment $\leftrightarrow$ SVO / SOV)

#### Linguistic Structure
Indian Sign Language follows an **OSV (Object-Subject-Verb)** or **Time-Topic-Comment** structure:
* **ISL:** `[CHEST, PAIN, DOCTOR, NEED]`
* **English (SVO):** *"I have chest pain and need a doctor."*
* **Hindi (SOV):** *"मुझे सीने में दर्द है और डॉक्टर की ज़रूरत है।"*
* **Tamil (SOV):** *"எனக்கு மார்பு வலி உள்ளது, மருத்துவர் தேவை."*

#### Transformation Algorithm
Implemented in [`backend/grammar_engine.py`](file:///c:/Users/srish/.gemini/antigravity/scratch/signbridge/backend/grammar_engine.py):

```python
def synthesize_spoken_sentence(gloss_tokens, target_lang='en'):
    # 1. Exact canonical idiomatic phrase matching (O(1) Hash Map)
    phrase_key = tuple(gloss_tokens)
    if phrase_key in self.exact_phrases:
        return self.exact_phrases[phrase_key][target_lang]

    # 2. Semantic Slot Extraction
    topic = [g for g in gloss_tokens if g in NOUNS]
    descriptors = [g for g in gloss_tokens if g in ADJECTIVES]
    actions = [g for g in gloss_tokens if g in VERBS]
    questions = [g for g in gloss_tokens if g in QUESTION_WORDS]
    polarity = False if "NOT" in gloss_tokens else True

    # 3. Target Language Syntactic Reconstruction
    if target_lang == 'en': # SVO with auxiliary copula insertion
        if questions:
            return f"{QUESTION_MAP_EN[questions[0]]} is the {' '.join(topic)}?"
        return f"I {' '.join(actions)} {' '.join(descriptors)} {' '.join(topic)}."
        
    elif target_lang == 'hi': # SOV with post-position case markers
        if questions:
            return f"{' '.join(topic)} {' '.join(descriptors)} {QUESTION_MAP_HI[questions[0]]} है?"
        return f"मुझे {' '.join(topic)} में {' '.join(descriptors)} है।"
        
    elif target_lang == 'ta': # SOV with agglutinative verbal endings
        return f"எனக்கு {' '.join(topic)} {' '.join(descriptors)} உள்ளது."
```

### Algorithm 9: Dynamic Time Warping (DTW) & Benchmark Evaluation

#### Objective
To evaluate model stability against real human signers, SignBridge uses **Dynamic Time Warping (DTW)** on 3D joint coordinate trajectories $X \in \mathbb{R}^{T_1 \times 321}$ and $Y \in \mathbb{R}^{T_2 \times 321}$:

$$D(i, j) = \|X_i - Y_j\|_2 + \min \begin{cases} D(i-1, j) & \text{(Insertion)} \\ D(i, j-1) & \text{(Deletion)} \\ D(i-1, j-1) & \text{(Match)} \end{cases}$$

$$\text{DTW Distance} = \frac{D(T_1, T_2)}{T_1 + T_2}$$

* Evaluated under a **Person-Independent Split** (Leave-One-Signer-Out) in [`backend/evaluate_dataset.py`](file:///c:/Users/srish/.gemini/antigravity/scratch/signbridge/backend/evaluate_dataset.py).
* Validates that the system generalizes to new signers with an average trajectory error under $0.082$.

### Algorithm 10: 3D WebGL Avatar Analytical Inverse Kinematics (IK)

#### Purpose & Geometry
When translating hearing speech into sign language, the 3D Avatar ([`frontend/src/components/AvatarRenderer.jsx`](file:///c:/Users/srish/.gemini/antigravity/scratch/signbridge/frontend/src/components/AvatarRenderer.jsx)) must place hands at specific anatomical target coordinates (e.g. wrist touching radial pulse point on left arm for `DOCTOR`).

#### Two-Bone Analytical IK Formulation
Given shoulder base $P_0$, target wrist location $P_2$, upper arm length $L_1$, and forearm length $L_2$:

1. **Distance to Target:**
   $$d = \|P_2 - P_0\|_2, \quad \text{clamped to } [|L_1 - L_2|, L_1 + L_2]$$

2. **Elbow Joint Angle (Law of Cosines):**
   $$\theta_{\text{elbow}} = \pi - \arccos \left( \frac{L_1^2 + L_2^2 - d^2}{2 L_1 L_2} \right)$$

3. **Shoulder Elevation & Azimuth:**
   $$\alpha = \arccos \left( \frac{L_1^2 + d^2 - L_2^2}{2 L_1 d} \right)$$
   $$\vec{u}_{\text{target}} = \frac{P_2 - P_0}{d}$$
   $$\theta_{\text{shoulder}} = \text{atan2}(u_y, u_x) \pm \alpha$$

4. **Smooth Quaternion SLERP Interpolation:**
   To eliminate robotic snapping between signs:
   $$q(t) = \text{SLERP}(q_{\text{start}}, q_{\text{target}}, t) = \frac{\sin((1-t)\Omega)}{\sin \Omega} q_{\text{start}} + \frac{\sin(t\Omega)}{\sin \Omega} q_{\text{target}}$$
