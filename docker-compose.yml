version: '3.8'

services:
  signbridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: signbridge:latest
    container_name: signbridge_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - FRONTEND_DIST_DIR=/app/frontend/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
