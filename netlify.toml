# ========================================================
# Netlify Configuration for SignBridge Frontend SPA
# ========================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Route all client navigation requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers for WASM, 3D WebGL, and MediaPipe models
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
